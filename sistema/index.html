<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel · Sistema LexFive</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0e1b2c">
  <link rel="apple-touch-icon" href="../assets/pwa/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LexFive">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/panel.css">
  <script>
    // Aplica el tema guardado (o el del sistema) antes de pintar, para evitar parpadeo.
    (function () {
      try {
        var t = localStorage.getItem('lexfive_theme');
        if (t !== 'dark' && t !== 'light') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        // Aplica el tamaño de letra guardado (accesibilidad) antes de pintar.
        var fs = parseFloat(localStorage.getItem('lexfive_fontscale'));
        if (fs >= 0.9 && fs <= 1.4) document.documentElement.style.fontSize = (fs * 100) + '%';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__head">
        <a href="../index.html" class="logo">
          <span class="logo__mark">L5</span>
          <span class="logo__text"><strong>LexFive</strong><small>Sistema</small></span>
        </a>
      </div>
      <nav class="sidebar__nav" id="sidebarNav"><!-- generado por JS --></nav>
      <div class="sidebar__foot">
        <div class="user-chip">
          <div class="avatar" id="userAvatar">--</div>
          <div class="user-chip__info">
            <strong id="userName">...</strong>
            <span id="userRol"></span>
          </div>
        </div>
        <button class="btn btn--ghost btn--sm btn--block" id="btnLogout">Cerrar sesión</button>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <!-- Principal -->
    <div class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="menu-toggle btn btn--ghost btn--sm" id="menuToggle" aria-label="Menú">&#9776;</button>
          <h1 id="pageTitle">Panel</h1>
        </div>
        <div class="topbar__right">
          <div class="font-ctrl" role="group" aria-label="Tamaño de letra">
            <button class="btn btn--ghost btn--sm font-ctrl__btn" id="btnFontMinus" type="button" aria-label="Reducir el tamaño de letra" title="Letra más pequeña">A−</button>
            <button class="btn btn--ghost btn--sm font-ctrl__btn" id="btnFontPlus" type="button" aria-label="Aumentar el tamaño de letra" title="Letra más grande">A+</button>
          </div>
          <button class="theme-toggle btn btn--ghost btn--sm" id="btnTheme" type="button" aria-label="Cambiar entre modo claro y oscuro" aria-pressed="false" title="Modo claro / oscuro"></button>
          <div class="topbar__actions" id="topbarActions"></div>
        </div>
      </header>
      <main class="content" id="content">
        <div class="loading"><div class="spinner"></div>Cargando...</div>
      </main>
    </div>
  </div>

  <!-- Modal genérico -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal__head"><h3 id="modalTitle">Título</h3><button class="modal__close" id="modalClose" aria-label="Cerrar">&times;</button></div>
      <div class="modal__body" id="modalBody"></div>
      <div class="modal__foot" id="modalFoot"></div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="bottom-nav__item active" data-key="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
      <span>Inicio</span>
    </button>
    <button class="bottom-nav__item" data-key="procesos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      <span>Procesos</span>
    </button>
    <button class="bottom-nav__item" data-key="agenda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      <span>Agenda</span>
    </button>
    <button class="bottom-nav__item" id="btnBottomMore">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
      <span>Más</span>
    </button>
  </nav>

  <script type="module" src="../js/branding.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
