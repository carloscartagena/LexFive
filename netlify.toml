# Configuración de Netlify para LexFive
# Define la página 404, cabeceras de seguridad y caché de recursos estáticos.

[build]
  publish = "."
  # Estampa una versión nueva en CSS/JS y en el Service Worker en cada despliegue,
  # para que los cambios se vean de inmediato en todos los dispositivos (incluido
  # el celular) sin tener que tocar nada a mano. Ver scripts/cache-bust.js
  command = "node scripts/cache-bust.js"

# ---- Página de error 404 personalizada ----
# Netlify usa automáticamente /404.html para rutas no encontradas.

# ---- Cabeceras de seguridad (aplican a todo el sitio) ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh https://cdn.jsdelivr.net https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.web3forms.com https://esm.sh https://connect.facebook.net https://www.facebook.com; frame-src https://www.google.com https://maps.google.com https://www.facebook.com https://web.facebook.com https://staticxx.facebook.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://api.web3forms.com"

# ---- Caché larga para assets versionados ----
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# CSS y JS NO llevan versión en el nombre (styles.css, main.js, app.js...), así
# que NO deben cachearse de forma "dura": el navegador debe revalidar siempre.
# Con "no-cache" el navegador pregunta "¿cambió?" y recibe un 304 instantáneo si
# no cambió, o la versión nueva si sí. Así los cambios se ven de inmediato tras
# un despliegue, sin tener que forzar recarga (Ctrl+Shift+R).
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sistema/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sistema/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# El service worker no debe cachearse para que se actualice de inmediato
[[headers]]
  for = "/sistema/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
